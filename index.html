<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAJHA YANTRA – साझा यन्त्र</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --g1: #064E3B;
      --g2: #059669;
      --g3: #34D399;
      --g4: #A7F3D0;
      --g5: #ECFDF5;
      --g6: #D1FAE5;
      --amber: #D97706;
      --amber2: #F59E0B;
      --amber-l: #FFFBEB;
      --amber-m: #FEF3C7;
      --blue: #1D4ED8;
      --blue2: #3B82F6;
      --blue-l: #EFF6FF;
      --blue-m: #DBEAFE;
      --orange: #EA580C;
      --orange-l: #FFF7ED;
      --red: #DC2626;
      --red-l: #FEF2F2;
      --purple: #7C3AED;
      --purple-l: #F5F3FF;
      --ai: #6D28D9;
      --ai2: #8B5CF6;
      --ai3: #C4B5FD;
      --ai-l: #F5F3FF;
      --ink: #111827;
      --ink2: #374151;
      --ink3: #6B7280;
      --ink4: #9CA3AF;
      --ink5: #D1D5DB;
      --bg: #F0FDF4;
      --card: #fff;
      --border: #D1FAE5;
      --border2: #E5E7EB;
      --sh: 0 1px 3px rgba(0, 0, 0, .08);
      --shm: 0 4px 6px -1px rgba(0, 0, 0, .07);
      --shl: 0 10px 15px -3px rgba(0, 0, 0, .08);
      --shxl: 0 20px 25px -5px rgba(0, 0, 0, .1);
      --r: 14px;
      --rs: 10px;
      --rx: 7px;
      --pill: 999px;
      --font: 'Inter', 'Noto Sans Devanagari', sans-serif;
      --ph-w: 300px;
      --ph-h: 600px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      font-family: var(--font);
      background: linear-gradient(145deg, #0F172A, #1E293B 50%, #0F2027);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }


    /* body: center phone on screen */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* CENTER - PHONE */
    .phone-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .phone-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, .4);
      letter-spacing: .1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .phone {
      width: var(--ph-w);
      height: var(--ph-h);
      border-radius: 38px;
      border: 6px solid #0F172A;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shxl), 0 0 0 1px rgba(255, 255, 255, .07), 0 0 60px rgba(5, 150, 105, .15);
      position: relative;
    }

    .phone::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 5px;
      background: #0F172A;
      border-radius: 10px;
      z-index: 200;
    }

    .sbar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: 6px;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      background: #fff;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      background: var(--bg);
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .sw {
      background: #fff;
    }

    .dots {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      cursor: pointer;
      transition: all .2s;
    }

    .dot.on {
      background: var(--g2);
      width: 14px;
      border-radius: 3px;
    }

    /* RIGHT - AI PANEL */
    .ai-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ai-header {
      background: linear-gradient(135deg, #3B0764, #6D28D9, #4F46E5);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .ai-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='30'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .ai-crown {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, .15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .ai-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }

    .ai-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, .6);
    }

    .ai-card {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(8px);
    }

    .ai-card-title {
      font-size: 10.5px;
      font-weight: 800;
      color: rgba(255, 255, 255, .45);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-card-title i {
      color: var(--ai3);
    }

    /* AI Predict blocks */
    .pred-block {
      background: rgba(109, 40, 217, .15);
      border: 1px solid rgba(196, 181, 253, .2);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 8px;
    }

    .pred-label {
      font-size: 9px;
      font-weight: 800;
      color: var(--ai3);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pred-value {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }

    .pred-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, .5);
    }

    .pred-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      margin: 5px 0 2px;
    }

    .pred-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--ai), var(--ai2));
    }

    .weather-row {
      display: flex;
      gap: 6px;
      margin-bottom: 9px;
    }

    .wday {
      flex: 1;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      padding: 7px 4px;
      text-align: center;
    }

    .wday .wd {
      font-size: 9px;
      color: rgba(255, 255, 255, .4);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .wday .wi {
      font-size: 16px;
      margin-bottom: 2px;
    }

    .wday .wt {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }

    .wday .wp {
      font-size: 9px;
      color: rgba(255, 255, 255, .4);
    }

    .wday.best {
      border-color: rgba(52, 211, 153, .4);
      background: rgba(5, 150, 105, .15);
    }

    .ai-insight {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 8px;
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
      margin-bottom: 6px;
      border-left: 2px solid var(--ai2);
    }

    .ai-insight:last-child {
      margin-bottom: 0;
    }

    .ai-insight i {
      font-size: 12px;
      color: var(--ai3);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .ai-insight-text {
      font-size: 10.5px;
      color: rgba(255, 255, 255, .7);
      line-height: 1.5;
    }

    .ai-insight-text b {
      color: #fff;
    }

    .veh-health {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .vh-card {
      flex: 1;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .vh-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .vh-name {
      font-size: 9px;
      font-weight: 700;
      color: rgba(255, 255, 255, .5);
      margin-bottom: 4px;
    }

    .vh-score {
      font-size: 16px;
      font-weight: 800;
    }

    .vh-status {
      font-size: 8.5px;
      font-weight: 700;
      margin-top: 2px;
    }

    .health-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      margin: 4px auto;
      width: 80%;
    }

    .hb-fill {
      height: 100%;
      border-radius: 2px;
    }

    .demand-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 60px;
      margin-bottom: 8px;
    }

    .dc-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .dc-bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      min-height: 4px;
      transition: height .3s;
    }

    .dc-lbl {
      font-size: 8px;
      color: rgba(255, 255, 255, .4);
      font-weight: 600;
    }

    .dc-val {
      font-size: 8px;
      color: rgba(255, 255, 255, .6);
      font-weight: 700;
    }

    .ai-btn {
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--ai), var(--ai2));
      color: #fff;
      box-shadow: 0 4px 14px rgba(109, 40, 217, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font);
      transition: all .2s;
      margin-top: 4px;
    }

    .ai-btn:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .ai-loading {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--ai3);
      padding: 10px;
      background: rgba(109, 40, 217, .15);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(196, 181, 253, .3);
      border-top-color: var(--ai2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .ai-response {
      font-size: 11px;
      color: rgba(255, 255, 255, .8);
      line-height: 1.6;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 9px;
      padding: 11px;
    }

    .ai-response b {
      color: #C4B5FD;
    }

    .ai-response .highlight {
      background: rgba(109, 40, 217, .2);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--ai3);
    }

    .location-picker {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .loc-btn {
      padding: 4px 9px;
      border-radius: var(--pill);
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .05);
      color: rgba(255, 255, 255, .6);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }

    .loc-btn.sel {
      border-color: var(--ai2);
      background: rgba(109, 40, 217, .25);
      color: var(--ai3);
    }

    .profit-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      font-size: 11px;
    }

    .profit-row:last-child {
      border: none;
    }

    .profit-k {
      color: rgba(255, 255, 255, .45);
    }

    .profit-v {
      color: #fff;
      font-weight: 700;
    }

    .profit-v.up {
      color: #34D399;
    }

    .profit-v.down {
      color: #F87171;
    }


    /* PHONE INTERNALS */
    .nbar {
      height: 46px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      background: #fff;
      border-bottom: 1px solid var(--border2);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }

    .nbk {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--g5);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--g1);
      font-size: 12px;
      flex-shrink: 0;
    }

    .ntitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .nact {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--g2);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font);
    }

    .bnav {
      height: 54px;
      display: flex;
      background: #fff;
      border-top: 1.5px solid var(--border2);
      flex-shrink: 0;
    }

    .bni {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 8px;
      font-weight: 600;
      color: var(--ink4);
      cursor: pointer;
      border: none;
      background: none;
      position: relative;
      font-family: var(--font);
    }

    .bni.on {
      color: var(--g2);
    }

    .bni i {
      font-size: 17px;
    }

    .bni.on i {
      background: var(--g5);
      border-radius: 9px;
      padding: 2px 8px;
    }

    .bni .nd {
      position: absolute;
      top: 6px;
      right: calc(50% - 12px);
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    .fu {
      animation: fu .3s ease forwards;
    }

    @keyframes fu {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .card {
      background: #fff;
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 8px;
      box-shadow: var(--sh);
      cursor: pointer;
      transition: all .2s;
    }

    .card:hover {
      border-color: var(--g3);
      box-shadow: var(--shm);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--pill);
    }

    .tg {
      background: var(--g5);
      color: var(--g1);
      border: 1px solid var(--g4);
    }

    .ta {
      background: var(--amber-m);
      color: #92400E;
      border: 1px solid #FDE68A;
    }

    .tb {
      background: var(--blue-m);
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }

    .tr {
      background: var(--red-l);
      color: var(--red);
      border: 1px solid #FECACA;
    }

    .tp {
      background: var(--purple-l);
      color: var(--purple);
      border: 1px solid #DDD6FE;
    }

    .sh {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--ink3);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin: 11px 0 6px;
    }

    .av {
      border-radius: 50%;
      background: linear-gradient(135deg, var(--g4), var(--g5));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--g1);
      flex-shrink: 0;
    }

    .stars {
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--amber2);
    }

    .srch {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      padding: 0 10px;
      gap: 7px;
      height: 38px;
    }

    .srch:focus-within {
      border-color: var(--g2);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, .1);
    }

    .srch input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--ink);
      font-family: var(--font);
      background: transparent;
    }

    .info {
      border-radius: var(--rx);
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 9px;
      font-size: 11px;
      line-height: 1.5;
    }

    .info i {
      margin-top: 1px;
      flex-shrink: 0;
      font-size: 12px;
    }

    .ig {
      background: var(--g5);
      border: 1px solid var(--g4);
      color: var(--g1);
    }

    .ia {
      background: var(--amber-m);
      border: 1px solid #FDE68A;
      color: #92400E;
    }

    .ib {
      background: var(--blue-m);
      border: 1px solid #BFDBFE;
      color: #1E40AF;
    }

    .ir {
      background: var(--red-l);
      border: 1px solid #FECACA;
      color: var(--red);
    }

    .ip {
      background: var(--purple-l);
      border: 1px solid #DDD6FE;
      color: var(--purple);
    }

    .stat {
      border-radius: 11px;
      padding: 10px 7px;
      text-align: center;
    }

    .sv {
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }

    .sl {
      font-size: 9px;
      font-weight: 600;
      color: var(--ink3);
      margin-top: 2px;
    }

    .pg {
      height: 4px;
      border-radius: 2px;
      background: var(--g6);
      overflow: hidden;
      margin: 3px 0;
    }

    .pf {
      height: 100%;
      background: linear-gradient(90deg, var(--g1), var(--g2));
      border-radius: 2px;
    }

    .steps {
      display: flex;
      gap: 0;
      position: relative;
      margin-bottom: 13px;
    }

    .steps::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--border2);
      z-index: 0;
    }

    .step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 1;
    }

    .sc {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      border: 2px solid var(--border2);
      background: #fff;
    }

    .sc.done {
      background: var(--g2);
      border-color: var(--g2);
      color: #fff;
    }

    .sc.act {
      background: #fff;
      border-color: var(--g2);
      color: var(--g2);
    }

    .sl2 {
      font-size: 7.5px;
      color: var(--ink3);
      text-align: center;
      font-weight: 600;
    }

    .ad {
      background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 9px 11px;
      display: flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 9px;
      cursor: pointer;
    }

    .svc {
      border-radius: 11px;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, .05);
      transition: transform .15s;
    }

    .svc:hover {
      transform: scale(1.06);
    }

    .svc .ei {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .svc .en {
      font-size: 7.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .role {
      background: #fff;
      border-radius: 13px;
      padding: 15px 10px;
      text-align: center;
      border: 2px solid var(--border2);
      cursor: pointer;
      transition: all .2s;
    }

    .role:hover {
      border-color: var(--g2);

      const res = await fetch('https://api.anthropic.com/v1/messages', {

        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })

      const d = await res.json();
      return d.content?.map(i => i.text || '').join('') || 'No response';
    }
